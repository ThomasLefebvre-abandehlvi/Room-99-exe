name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Compile EXE with Custom Logo
        run: |
          npx nativefier "https://room99-eight.vercel.app/" \
            --name "Room 99 - The Vault" \
            --icon "./room99logo.jpg" \
            --platform windows \
            --arch x64 \
            ./out

      - name: Zip the Output
        run: zip -r Room99-Windows.zip ./out

      - name: Save Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Windows-EXE
          path: Room99-Windows.zip
