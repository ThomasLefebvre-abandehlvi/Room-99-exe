name: Build Game (EXE & Web)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npx vite build

      - name: Zip Web Build (dist folder)
        run: |
          cd dist && zip -r ../Room99-Web.zip ./*

      - name: Compile EXE with Custom Logo
        run: |
          npx nativefier "https://room99-eight.vercel.app/" \
            --name "Room 99 - The Vault" \
            --icon "./room99logo.jpg" \
            --platform windows \
            --arch x64 \
            ./out

      - name: Zip EXE Output
        run: zip -r Room99-Windows.zip ./out

      - name: Save Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-HTML5-Build
          path: Room99-Web.zip

      - name: Save EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: Room99-Windows.zip
